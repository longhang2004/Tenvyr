name: Release CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LLM_PROVIDER: mock
  LLM_FAILURE_MODE: mock
  # P2: installed-runtime gates are OPT-IN. CI runs the deterministic
  # fake-CLI tests by default; set TENVYR_LIVE_RUNTIME_GATES: "1" on a
  # self-hosted runner with the CLIs installed to run the live probes
  # (codex/claude/opencode local version/auth-state checks only).
  TENVYR_LIVE_RUNTIME_GATES: "0"

jobs:
  repository-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Reject tracked secrets and build artifacts
        shell: bash
        run: |
          forbidden="$(git ls-files '*.env' '*.key' '*.pem' '*.tgz' '*.whl' '*.tar.gz' '*.zip' | grep -v '^.env.self-hosted.example$' || true)"
          if [ -n "$forbidden" ]; then
            echo "Tracked secret or build artifact paths are forbidden:"
            echo "$forbidden"
            exit 1
          fi
          if git ls-files scripts/compress.sh | grep -q .; then
            echo "Owner artifact scripts/compress.sh must remain untracked"
            exit 1
          fi
          if git grep -qE -- '-----BEGIN( [A-Z]+)? PRIVATE KEY-----'; then
            echo "Tracked private-key material is forbidden"
            exit 1
          fi

      - name: Repository verifiers
        run: |
          node --test scripts/setup-check.test.mjs
          pnpm test:identity
          pnpm verify:identity
          pnpm test:docs
          pnpm verify:docs
          pnpm verify:package-packs

      - name: TypeScript tests and builds
        run: |
          pnpm -r test
          pnpm --filter @tenvyr/worker test -- --detectOpenHandles
          node --test scripts/smoke-e2e.test.mjs
          pnpm build:all

      - name: Frontend quality
        run: |
          pnpm --filter frontend lint
          pnpm --filter frontend typecheck
          pnpm --filter frontend test:safe-preview

      - name: Diff hygiene for pull requests
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"

      - name: Diff hygiene for pushes
        if: github.event_name == 'push'
        run: git diff --check "${{ github.event.before }}..${{ github.sha }}"

  python-worker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python Worker
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './sdks/python-worker[dev]'

      - name: Cross-version contract and unit tests
        run: |
          python scripts/sync-python-worker-schemas.py check
          python -m pytest sdks/python-worker/tests -m conformance
          python -m pytest sdks/python-worker/tests -m 'not conformance and not stress and not lifecycle'

      - name: Stress and lifecycle tests
        if: matrix.python-version == '3.11'
        run: |
          python -m pytest sdks/python-worker/tests -m stress
          python -m pytest sdks/python-worker/tests -m lifecycle

      - name: Static checks
        if: matrix.python-version == '3.11'
        run: |
          python -m ruff check sdks/python-worker/src sdks/python-worker/tests examples/python-http-worker scripts/sync-python-worker-schemas.py scripts/verify-python-worker-package.py
          python -m ruff format --check sdks/python-worker/src sdks/python-worker/tests examples/python-http-worker scripts/sync-python-worker-schemas.py scripts/verify-python-worker-package.py
          cd sdks/python-worker
          python -m mypy

      - name: Package and example verification
        if: matrix.python-version == '3.11'
        run: |
          python scripts/verify-python-worker-package.py
          python -m pytest examples/python-http-worker/tests

      - uses: pnpm/action-setup@v4
        if: matrix.python-version == '3.11'
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        if: matrix.python-version == '3.11'
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace for loopback
        if: matrix.python-version == '3.11'
        run: pnpm install --frozen-lockfile

      - name: Real Orchestrator to Python loopback
        if: matrix.python-version == '3.11'
        env:
          TENVYR_PYTHON_EXECUTABLE: python
        run: pnpm --filter orchestrator test:python-worker-loopback

  java-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Java Runner tests
        run: mvn -B -f services/agent-runner/pom.xml test

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Provision the disposable test database
        run: |
          docker run --rm --network host -e PGPASSWORD=postgres postgres:15-alpine \
            psql -U postgres -h 127.0.0.1 -p 5432 -c "CREATE DATABASE tenvyr_roadmap_test"

      - name: Real PostgreSQL integration suite (run 1)
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/tenvyr_roadmap_test
          TENVYR_LIVE_RUNTIME_GATES: "0"
        run: |
          set -o pipefail
          pnpm --filter orchestrator test -- --runInBand 2>&1 | tee /tmp/pg-run1.log
          node scripts/assert-jest-run.mjs /tmp/pg-run1.log

      - name: Real PostgreSQL integration suite (run 2, reinitialized)
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/tenvyr_roadmap_test
          TENVYR_LIVE_RUNTIME_GATES: "0"
        run: |
          set -o pipefail
          docker run --rm --network host -e PGPASSWORD=postgres postgres:15-alpine \
            psql -U postgres -h 127.0.0.1 -p 5432 -c "DROP DATABASE tenvyr_roadmap_test; CREATE DATABASE tenvyr_roadmap_test"
          pnpm --filter orchestrator test -- --runInBand 2>&1 | tee /tmp/pg-run2.log
          node scripts/assert-jest-run.mjs /tmp/pg-run2.log

  self-hosted-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Self-hosted deployment contract gate (required)
        run: pnpm self-hosted:contract-test

  self-hosted-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Disposable self-hosted recovery E2E (required)
        run: pnpm self-hosted:recovery-test

      - name: Show leftover containers on failure
        if: failure()
        run: docker ps -a

  docker-showcase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Validate showcase Compose configuration
        run: docker compose -p tenvyr-showcase -f docker-compose.yml -f docker-compose.showcase.yml config

      - name: Start showcase
        run: pnpm showcase:up

      - name: Run offline showcase smoke
        run: pnpm showcase:smoke

      - name: Show container logs on failure
        if: failure()
        run: docker compose -p tenvyr-showcase -f docker-compose.yml -f docker-compose.showcase.yml logs --no-color

      - name: Stop showcase
        if: always()
        run: pnpm showcase:down
