# Compose Watch rebuilds Java services on source/resource changes; frontend retains HMR.
services:
  gateway:
    develop:
      watch:
        - action: rebuild
          path: ./backend
          ignore: ["**/target/", "**/native/tenvyr-process-launcher"]
        - action: rebuild
          path: ./skills
  orchestrator:
    develop:
      watch:
        - action: rebuild
          path: ./backend
          ignore: ["**/target/", "**/native/tenvyr-process-launcher"]
        - action: rebuild
          path: ./skills
  agent-code-reviewer:
    develop:
      watch:
        - action: rebuild
          path: ./backend
          ignore: ["**/target/", "**/native/tenvyr-process-launcher"]
        - action: rebuild
          path: ./skills
  agent-observability:
    develop:
      watch:
        - action: rebuild
          path: ./backend
          ignore: ["**/target/", "**/native/tenvyr-process-launcher"]
        - action: rebuild
          path: ./skills
  frontend:
    environment:
      - NODE_ENV=development
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
      - /usr/src/app/.next
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
